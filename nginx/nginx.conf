events {
    worker_connections 1024;
}

http {
    upstream agentsentinel_api {
        server api:8000;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # Certificates
        # Replace server.crt / server.key with your organisation's CA-signed cert.
        # See nginx/generate-certs.sh to generate a self-signed cert for testing.
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS — only TLS 1.2 and 1.3, strong ciphers
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;
        ssl_session_tickets       off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           DENY                                            always;
        add_header X-Content-Type-Options    nosniff                                         always;
        add_header X-XSS-Protection          "1; mode=block"                                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;

        # ── API ───────────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://agentsentinel_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE and long-poll events must not be buffered or cut short
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
            proxy_buffering       off;
            proxy_cache           off;

            client_max_body_size  10m;
        }

        # ── FastAPI interactive docs ──────────────────────────────────────────
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass         http://agentsentinel_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── React UI (production build) ───────────────────────────────────────
        # To serve the built UI from Nginx instead of the Vite dev server:
        #   cd ui && npm run build
        # Then uncomment the block below and mount ui/dist in docker-compose.yml:
        #
        # location / {
        #     root  /usr/share/nginx/html;
        #     index index.html;
        #     try_files $uri $uri/ /index.html;
        # }
    }
}
